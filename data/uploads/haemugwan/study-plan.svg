    <text x="712" y="236">온실 유리문</text>
    <text x="712" y="352" font-size="14" opacity="0.85">※ 평소 잠김 · 열쇠: 정원사/집사</text>
    <text x="20" y="410" font-size="15">세면실</text>
    <text x="620" y="440" font-size="14">서류장</text>
  </g>
  <!-- desk -->
  <rect x="300" y="250" width="200" height="90" fill="none" stroke="#f6d58b" stroke-width="3"/>
  <text x="352" y="302" font-family="Batang, serif" font-size="18" fill="#f6d58b">책상</text>
  <circle cx="470" cy="270" r="9" fill="none" stroke="#ff9f8a" stroke-width="3"/>
  <text x="484" y="290" font-family="Batang, serif" font-size="13" fill="#ff9f8a">디캔터 · 잔</text>
  <ellipse cx="420" cy="360" rx="70" ry="22" fill="#ff9f8a" opacity="0.18"/>
  <text x="380" y="395" font-family="Batang, serif" font-size="13" fill="#ff9f8a">브랜디 얼룩</text>
  <!-- body -->
  <path d="M390 238 q30 -30 60 0" fill="none" stroke="#ff6b5a" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="240" y="232" font-family="Batang, serif" font-size="14" fill="#ff6b5a">피해자 (책상에 엎드린 자세)</text>
  <!-- fireplace -->
  <rect x="120" y="190" width="40" height="120" fill="none" stroke="#e7f0f8" stroke-width="3"/>
  <text x="170" y="256" font-family="Batang, serif" font-size="15" fill="#e7f0f8">벽난로 (불씨 꺼짐)</text>
  <!-- painting -->
  <path d="M300 136 H460" stroke="#f6d58b" stroke-width="10"/>
  <text x="300" y="168" font-family="Batang, serif" font-size="15" fill="#f6d58b">그림 「해무」</text>
  <!-- footprints -->
  <g fill="#9fd3ff" opacity="0.9">
    <ellipse cx="672" cy="300" rx="7" ry="12" transform="rotate(-70 672 300)"/><ellipse cx="640" cy="318" rx="7" ry="12" transform="rotate(-70 640 318)"/>
    <ellipse cx="606" cy="300" rx="7" ry="12" transform="rotate(-70 606 300)"/><ellipse cx="572" cy="318" rx="7" ry="12" transform="rotate(-70 572 318)"/>
    <ellipse cx="538" cy="302" rx="7" ry="12" transform="rotate(-70 538 302)"/>
    <ellipse cx="560" cy="200" rx="7" ry="12" transform="rotate(-110 560 200)"/><ellipse cx="596" cy="214" rx="7" ry="12" transform="rotate(-110 596 214)"/>
    <ellipse cx="632" cy="200" rx="7" ry="12" transform="rotate(-110 632 200)"/><ellipse cx="668" cy="214" rx="7" ry="12" transform="rotate(-110 668 214)"/>
    <ellipse cx="420" cy="160" rx="7" ry="12" transform="rotate(-150 420 160)"/><ellipse cx="470" cy="180" rx="7" ry="12" transform="rotate(-130 470 180)"/><ellipse cx="516" cy="194" rx="7" ry="12" transform="rotate(-120 516 194)"/>
  </g>
  <text x="520" y="350" font-family="Batang, serif" font-size="14" fill="#9fd3ff">젖은 발자국 (약 235mm)</text>
  <g font-family="Batang, serif" fill="#e7f0f8" font-size="13" opacity="0.75">
    <text x="40" y="624">축척 없음 · 연필 스케치를 청사진 용지에 옮김</text>
    <text x="760" y="624">N ↑</text>
  </g>
</svg>
